{% from '_icons.html' import icon %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2eb">
  <title>Ujagaga Radio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
</head>
<body>
  <div class="shell">
    <main>
      <p id="connection-status" role="status" hidden></p>
      <div id="player-content">{% include '_player.html' %}</div>
      <section class="stations" id="stations" aria-label="Stations">
        <div id="station-content">{% include '_station_list.html' %}</div>
      </section>
    </main>
  </div>
  <input type="file" id="playlist-file" accept=".m3u,.m3u8,audio/x-mpegurl" hidden>
  <dialog id="add-dialog"><form method="get" action="/"><div class="dialog-header"><h2>Add a station</h2><button type="button" class="icon-button" data-close-dialog aria-label="Close">{{ icon('close') }}</button></div><p>Bring a new sound home. Paste a radio stream URL below.</p><input type="hidden" name="action" value="add"><label for="stream-url">Stream URL</label><input id="stream-url" name="url" type="url" placeholder="https://radio.example.com/stream" required><p class="form-hint">Use the direct audio stream link from your radio station.</p><button class="button primary" type="submit">{{ icon('plus') }} Add & play station</button></form></dialog>
  <script src="{{ url_for('static', filename='js/custom.js') }}"></script>
</body>
</html>
