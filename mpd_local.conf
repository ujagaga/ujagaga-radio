# MPD config used by run_radio.sh (desktop, non-daemon). Audio goes to PulseAudio/PipeWire.
# SD card friendly: no music db, state or log files; logs go to the terminal.
# The station list is kept by radio.py in ~/.mpd/stations.db, not by mpd.
# Without these mpd falls back to ~/Music and ~/.cache/mpd/db; keep them in RAM
music_directory		"/dev/shm/ujagaga-radio/music"
db_file			"/dev/shm/ujagaga-radio/db"
bind_to_address		"localhost"
port			"6601"
log_level		"warning"

audio_output {
	type		"pulse"
	name		"Pulse"
}

input {
        plugin "curl"
}

filesystem_charset		"UTF-8"
